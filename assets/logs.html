<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumino 服务器日志</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1e1e1e; color: #d4d4d4; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #252526; padding: 12px 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .header h1 { font-size: 1.2em; color: #fff; }
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .controls button { background: #0e639c; color: white; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 0.9em; }
        .controls button:hover { background: #1177bb; }
        .controls button.clear { background: #c75450; }
        .filter-group { display: flex; gap: 8px; font-size: 0.85em; }
        .search-box { background: #3c3c3c; border: 1px solid #555; color: #d4d4d4; padding: 4px 8px; border-radius: 3px; width: 200px; }
        .log-container { flex: 1; overflow-y: auto; padding: 10px; font-family: Consolas, Monaco, monospace; font-size: 0.85em; line-height: 1.5; }
        .log-entry { padding: 4px 8px; border-left: 3px solid transparent; margin-bottom: 2px; display: flex; gap: 10px; }
        .log-entry:hover { background: #2a2d2e; }
        .log-entry.debug { border-left-color: #858585; }
        .log-entry.info { border-left-color: #75beff; }
        .log-entry.warn { border-left-color: #ffcc00; }
        .log-entry.error { border-left-color: #f48771; }
        .log-time { color: #858585; min-width: 175px; }
        .log-level { min-width: 50px; font-weight: bold; font-size: 0.8em; text-transform: uppercase; }
        .log-level.debug { color: #858585; }
        .log-level.info { color: #75beff; }
        .log-level.warn { color: #ffcc00; }
        .log-level.error { color: #f48771; }
        .log-message { flex: 1; word-break: break-all; }
        .status-bar { background: #007acc; color: white; padding: 5px 20px; font-size: 0.85em; display: flex; justify-content: space-between; }
        .status-bar.disconnected { background: #c75450; }
        .status-bar.connecting { background: #ffcc00; color: #333; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Lumino 服务器日志</h1>
        <div class="controls">
            <input type="text" class="search-box" id="searchBox" placeholder="搜索日志...">
            <div class="filter-group">
                <label><input type="checkbox" id="filterDebug" checked> Debug</label>
                <label><input type="checkbox" id="filterInfo" checked> Info</label>
                <label><input type="checkbox" id="filterWarn" checked> Warn</label>
                <label><input type="checkbox" id="filterError" checked> Error</label>
            </div>
            <button onclick="clearLogs()">清空</button>
            <button class="clear" onclick="reconnect()">重连</button>
        </div>
    </div>
    <div class="log-container" id="logContainer"></div>
    <div class="status-bar" id="statusBar">
        <span id="connectionStatus">正在连接...</span>
        <span id="logCount">0 条日志</span>
    </div>

    <script>
        let ws = null;
        let logEntries = [];
        const logContainer = document.getElementById('logContainer');
        const statusBar = document.getElementById('statusBar');
        const connectionStatus = document.getElementById('connectionStatus');
        const logCount = document.getElementById('logCount');

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = protocol + '//' + window.location.host + '/ws';

        function connect() {
            statusBar.className = 'status-bar connecting';
            connectionStatus.textContent = '正在连接...';
            ws = new WebSocket(wsUrl);
            ws.onopen = function () {
                statusBar.className = 'status-bar';
                connectionStatus.textContent = '已连接';
                ws.send(JSON.stringify({ type: 'subscribeLogs' }));
                addLogEntry({ timestamp: new Date().toISOString(), level: 'info', message: '已连接到日志服务器' });
            };
            ws.onmessage = function (event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'log') addLogEntry(data);
                    else if (data.type === 'logHistory') data.logs.forEach(l => addLogEntry(l));
                } catch (e) { console.error('解析消息失败:', e); }
            };
            ws.onclose = function () {
                statusBar.className = 'status-bar disconnected';
                connectionStatus.textContent = '已断开';
                setTimeout(connect, 3000);
            };
            ws.onerror = function () {
                statusBar.className = 'status-bar disconnected';
                connectionStatus.textContent = '连接错误';
            };
        }

        function addLogEntry(entry) {
            logEntries.push(entry);
            const div = document.createElement('div');
            div.className = 'log-entry ' + entry.level;
            div.dataset.level = entry.level;
            let html = '<span class="log-time">' + formatTime(entry.timestamp) + '</span>';
            html += '<span class="log-level ' + entry.level + '">' + entry.level + '</span>';
            html += '<span class="log-message">' + escapeHtml(entry.message) + '</span>';
            div.innerHTML = html;
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
            logCount.textContent = logEntries.length + ' 条日志';
            applyFilters();
        }

        function formatTime(ts) {
            return new Date(ts).toISOString().replace('T', ' ').substring(0, 23);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearLogs() { logEntries = []; logContainer.innerHTML = ''; logCount.textContent = '0 条日志'; }
        function reconnect() { if (ws) ws.close(); connect(); }

        function applyFilters() {
            const searchText = document.getElementById('searchBox').value.toLowerCase();
            const showDebug = document.getElementById('filterDebug').checked;
            const showInfo = document.getElementById('filterInfo').checked;
            const showWarn = document.getElementById('filterWarn').checked;
            const showError = document.getElementById('filterError').checked;
            let visible = 0;
            document.querySelectorAll('.log-entry').forEach(entry => {
                const level = entry.dataset.level;
                const text = entry.textContent.toLowerCase();
                let show = true;
                if (level === 'debug' && !showDebug) show = false;
                if (level === 'info' && !showInfo) show = false;
                if (level === 'warn' && !showWarn) show = false;
                if (level === 'error' && !showError) show = false;
                if (searchText && !text.includes(searchText)) show = false;
                entry.classList.toggle('hidden', !show);
                if (show) visible++;
            });
            logCount.textContent = visible + ' / ' + logEntries.length + ' 条日志';
        }

        document.getElementById('searchBox').addEventListener('input', applyFilters);
        ['filterDebug', 'filterInfo', 'filterWarn', 'filterError'].forEach(id =>
            document.getElementById(id).addEventListener('change', applyFilters));

        connect();
    </script>
</body>
</html>
