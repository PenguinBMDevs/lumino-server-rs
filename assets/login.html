<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumino 安全控制台 · 登录</title>
    <link rel="icon" href="/app-icon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js"></script>

    <!-- 主题防闪烁 -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("lumino-theme") || "auto";
          var dark = m === "dark" || (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <style>
      :root {
        --canvas: #f6f8fa; --surface: #ffffff; --border: #d0d7de; --fg: #1f2328;
        --fg-muted: #656d76; --fg-subtle: #6e7781; --accent: #0969da;
        --accent-soft: rgba(9,105,218,0.10); --success: #1a7f37; --success-soft: rgba(26,127,55,0.12);
        --danger: #cf222e; --danger-soft: rgba(207,34,46,0.10); --input-bg: #ffffff; --input-border: #d0d7de;
        --brand-from: #6366f1; --brand-to: #8b5cf6;
      }
      html.dark {
        --canvas: #010409; --surface: #161b22; --border: #30363d; --fg: #e6edf3;
        --fg-muted: #7d8590; --fg-subtle: #6e7681; --accent: #2f81f7;
        --accent-soft: rgba(56,139,253,0.15); --success: #3fb950; --success-soft: rgba(63,185,80,0.15);
        --danger: #f85149; --danger-soft: rgba(248,81,73,0.12); --input-bg: #0d1117; --input-border: #30363d;
        --brand-from: #6366f1; --brand-to: #8b5cf6;
      }
      * { -webkit-font-smoothing: antialiased; }
      body {
        background: var(--canvas); color: var(--fg); min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
      .field { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg); border-radius: 10px; padding: 0.75rem 1rem; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
      .field::placeholder { color: var(--fg-subtle); }
      .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .btn-primary { background: linear-gradient(135deg, var(--brand-from), var(--brand-to)); color: #fff; font-weight: 600; border-radius: 10px; padding: 0.75rem 1rem; transition: filter 0.15s ease, transform 0.05s ease; }
      .btn-primary:hover { filter: brightness(1.08); }
      .btn-primary:active { transform: translateY(1px); }
      .alert { border-radius: 10px; padding: 0.5rem 0.75rem; font-size: 0.875rem; border: 1px solid transparent; }
      .alert-error { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-soft); }
      .tx-ok { color: var(--success); } .tx-sub { color: var(--fg-subtle); } .tx-muted { color: var(--fg-muted); } .tx-fg { color: var(--fg); }
      .theme-toggle { position: fixed; top: 1rem; right: 1rem; display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .theme-toggle button { background: transparent; border: none; color: var(--fg-muted); padding: 0.35rem 0.6rem; font-size: 0.9rem; cursor: pointer; line-height: 1; }
      .theme-toggle button.active { background: var(--accent-soft); color: var(--accent); }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="theme-toggle" id="theme-seg">
      <button data-theme="auto" title="跟随系统">🖥</button>
      <button data-theme="light" title="亮色">☀</button>
      <button data-theme="dark" title="暗色">🌙</button>
    </div>

    <main class="relative w-full max-w-md">
      <div class="flex flex-col items-center mb-6">
        <img src="/app-icon.ico" alt="Lumino" class="w-16 h-16 rounded-2xl" />
        <h1 class="mt-4 text-2xl font-semibold tracking-tight" style="color: var(--fg)">Lumino 安全控制台</h1>
        <p class="text-sm tx-muted">多人协作服务器 · 管理员鉴权</p>
      </div>

      <form id="login-form" class="relative auth-card p-7">
        <div class="flex items-center gap-2 mb-5 text-xs font-medium tx-ok">
          <span class="w-2 h-2 rounded-full" style="background: var(--success)"></span>
          端到端加密通道已启用
        </div>

        <label for="username" class="block text-sm font-medium tx-muted mb-2">用户名</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          required
          value="admin"
          placeholder="请输入用户名"
          class="field w-full"
        />

        <label for="password" class="block text-sm font-medium tx-muted mb-2 mt-4">密码</label>
        <div class="relative">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="请输入密码"
            class="field w-full pr-12"
          />
          <button type="button" id="toggle" class="absolute right-3 top-1/2 -translate-y-1/2 tx-muted hover:opacity-80" aria-label="显示密码">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>

        <div id="error" class="hidden mt-3 alert alert-error"></div>

        <button
          id="submit"
          type="submit"
          class="mt-6 w-full btn-primary flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span id="label">登 录</span>
          <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path>
          </svg>
        </button>

        <div id="turnstile-holder" class="mt-4"></div>

        <p class="mt-4 text-center text-xs tx-sub">
          受 Argon2id + AES-256-GCM 保护 · 连续失败将临时锁定
        </p>
      </form>

      <p class="mt-6 text-center text-xs tx-sub">
        默认管理员密码 <code style="color: var(--fg-muted)">admin</code> · 首次登录需强制修改
      </p>
      <p class="mt-3 text-center text-xs tx-muted">还没有账户？<a href="/register" style="color: var(--accent)">立即注册</a></p>
    </main>

    <script>
      const form = document.getElementById("login-form");
      const pw = document.getElementById("password");
      const errBox = document.getElementById("error");
      const submit = document.getElementById("submit");
      const label = document.getElementById("label");
      const spinner = document.getElementById("spinner");
      const toggle = document.getElementById("toggle");

      toggle.addEventListener("click", () => {
        const t = pw.type === "password" ? "text" : "password";
        pw.type = t;
      });

      function showError(msg) {
        errBox.textContent = msg;
        errBox.classList.remove("hidden");
      }

      let ttEnabled = false;
      async function setupTurnstile() {
        try {
          const cfg = await (await fetch("/api/settings/turnstile")).json();
          if (!cfg.enabled || !cfg.site_key) return;
          ttEnabled = true;
          const holder = document.getElementById("turnstile-holder");
          holder.innerHTML = '<div id="tt-widget"></div>';
          const el = document.getElementById("tt-widget");
          const mount = () => {
            if (window.turnstile && typeof window.turnstile.ready === "function") {
              turnstile.ready(() => {
                turnstile.render(el, {
                  sitekey: cfg.site_key,
                  action: "login",
                  "error-callback": () => showError("人机验证组件加载失败，请刷新页面后重试"),
                });
              });
            } else {
              setTimeout(mount, 120);
            }
          };
          mount();
        } catch (e) { }
      }
      setupTurnstile();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.classList.add("hidden");
        label.textContent = "验证中";
        spinner.classList.remove("hidden");
        submit.disabled = true;

        try {
          const token = ttEnabled
            ? (document.querySelector('#tt-widget [name="cf-turnstile-response"]')?.value || "")
            : "";
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: document.getElementById("username").value, password: pw.value, turnstile_token: token }),
          });
          const data = await res.json();
          if (res.ok && data.success) {
            window.location.href = data.requires_change ? "/change-password" : "/monitor";
          } else {
            showError(data.error || "登录失败");
            if (ttEnabled && window.turnstile) turnstile.reset("#tt-widget");
            if (data.lock_seconds) { startLock(data.lock_seconds); }
          }
        } catch (e) {
          showError("网络错误，请稍后重试");
        } finally {
          if (!submit.disabled) {
            label.textContent = "登 录";
            spinner.classList.add("hidden");
          }
        }
      });

      let lockTimer = null;
      function startLock(sec) {
        label.textContent = `锁定中 (${sec}s)`;
        spinner.classList.add("hidden");
        submit.disabled = true;
        clearInterval(lockTimer);
        lockTimer = setInterval(() => {
          sec -= 1;
          if (sec <= 0) {
            clearInterval(lockTimer);
            label.textContent = "登 录";
            submit.disabled = false;
          } else {
            label.textContent = `锁定中 (${sec}s)`;
          }
        }, 1000);
      }
    </script>

    <script>
      (function () {
        var seg = document.getElementById("theme-seg");
        function apply(m) {
          var dark = m === "dark" || (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          seg.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b.dataset.theme === m); });
        }
        var m = localStorage.getItem("lumino-theme") || "auto"; apply(m);
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if ((localStorage.getItem("lumino-theme") || "auto") === "auto") apply("auto"); });
        seg.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; var t = b.dataset.theme; localStorage.setItem("lumino-theme", t); apply(t); });
      })();
    </script>
  </body>
</html>
