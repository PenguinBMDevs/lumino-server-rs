<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumino 安全控制台 · 修改密码</title>
    <link rel="icon" href="/app-icon.ico" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 主题防闪烁 -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("lumino-theme") || "auto";
          var dark = m === "dark" || (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <style>
      :root {
        --canvas: #f6f8fa; --surface: #ffffff; --border: #d0d7de; --fg: #1f2328;
        --fg-muted: #656d76; --fg-subtle: #6e7781; --accent: #0969da;
        --accent-soft: rgba(9,105,218,0.10); --success: #1a7f37; --success-soft: rgba(26,127,55,0.12);
        --danger: #cf222e; --danger-soft: rgba(207,34,46,0.10); --warning: #9a6700; --warning-soft: rgba(154,103,0,0.12);
        --input-bg: #ffffff; --input-border: #d0d7de; --brand-from: #6366f1; --brand-to: #8b5cf6;
      }
      html.dark {
        --canvas: #010409; --surface: #161b22; --border: #30363d; --fg: #e6edf3;
        --fg-muted: #7d8590; --fg-subtle: #6e7681; --accent: #2f81f7;
        --accent-soft: rgba(56,139,253,0.15); --success: #3fb950; --success-soft: rgba(63,185,80,0.15);
        --danger: #f85149; --danger-soft: rgba(248,81,73,0.12); --warning: #d29922; --warning-soft: rgba(210,153,34,0.15);
        --input-bg: #0d1117; --input-border: #30363d; --brand-from: #6366f1; --brand-to: #8b5cf6;
      }
      * { -webkit-font-smoothing: antialiased; }
      body {
        background: var(--canvas); color: var(--fg); min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", "PingFang SC", "Microsoft YaHei", Helvetica, Arial, sans-serif;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
      .field { background: var(--input-bg); border: 1px solid var(--input-border); color: var(--fg); border-radius: 10px; padding: 0.75rem 1rem; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
      .field::placeholder { color: var(--fg-subtle); }
      .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .btn-primary { background: linear-gradient(135deg, var(--brand-from), var(--brand-to)); color: #fff; font-weight: 600; border-radius: 10px; padding: 0.75rem 1rem; transition: filter 0.15s ease, transform 0.05s ease; }
      .btn-primary:hover { filter: brightness(1.08); }
      .btn-primary:active { transform: translateY(1px); }
      .alert { border-radius: 10px; padding: 0.5rem 0.75rem; font-size: 0.875rem; border: 1px solid transparent; }
      .alert-error { color: var(--danger); background: var(--danger-soft); border-color: var(--danger-soft); }
      .alert-ok { color: var(--success); background: var(--success-soft); border-color: var(--success-soft); }
      .alert-warn { color: var(--warning); background: var(--warning-soft); border-color: var(--warning-soft); }
      .tx-ok { color: var(--success); } .tx-sub { color: var(--fg-subtle); } .tx-muted { color: var(--fg-muted); } .tx-fg { color: var(--fg); }
      .bar-off { background: var(--border); } .bar-weak { background: #f85149; } .bar-mid { background: #d29922; } .bar-strong { background: #3fb950; }
      .theme-toggle { position: fixed; top: 1rem; right: 1rem; display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
      .theme-toggle button { background: transparent; border: none; color: var(--fg-muted); padding: 0.35rem 0.6rem; font-size: 0.9rem; cursor: pointer; line-height: 1; }
      .theme-toggle button.active { background: var(--accent-soft); color: var(--accent); }
    </style>
  </head>
  <body class="min-h-screen flex items-center justify-center p-4">
    <div class="theme-toggle" id="theme-seg">
      <button data-theme="auto" title="跟随系统">🖥</button>
      <button data-theme="light" title="亮色">☀</button>
      <button data-theme="dark" title="暗色">🌙</button>
    </div>

    <main class="relative w-full max-w-md">
      <div class="flex flex-col items-center mb-6">
        <img src="/app-icon.ico" alt="Lumino" class="w-16 h-16 rounded-2xl" />
        <h1 class="mt-4 text-2xl font-semibold tracking-tight" style="color: var(--fg)">安全加固 required</h1>
        <p class="text-sm tx-muted">检测到使用默认密码，请立即设置新密码</p>
      </div>

      <form id="cp-form" class="relative auth-card p-7">
        <div class="mb-5 rounded-lg alert alert-warn">
          ⚠ 出于安全合规，首次登录必须修改默认密码。新密码强度需满足下方全部要求。
        </div>

        <label class="block text-sm font-medium tx-muted mb-2">当前密码</label>
        <input id="current" type="password" autocomplete="current-password" required class="field w-full" placeholder="默认 admin" />

        <label class="block text-sm font-medium tx-muted mt-4 mb-2">新密码</label>
        <input id="np" type="password" autocomplete="new-password" required class="field w-full" placeholder="至少 12 位" />

        <div class="mt-3 flex gap-1">
          <div class="h-1.5 flex-1 rounded bar-off" id="b0"></div>
          <div class="h-1.5 flex-1 rounded bar-off" id="b1"></div>
          <div class="h-1.5 flex-1 rounded bar-off" id="b2"></div>
          <div class="h-1.5 flex-1 rounded bar-off" id="b3"></div>
        </div>
        <p id="strength-label" class="mt-1 text-xs tx-sub">强度：—</p>

        <label class="block text-sm font-medium tx-muted mt-4 mb-2">确认新密码</label>
        <input id="confirm" type="password" autocomplete="new-password" required class="field w-full" placeholder="再次输入" />

        <ul class="mt-4 space-y-1.5 text-xs">
          <li data-req="len" class="flex items-center gap-2 tx-sub"><span class="tick">○</span> 至少 12 位字符</li>
          <li data-req="cls" class="flex items-center gap-2 tx-sub"><span class="tick">○</span> 含大小写字母、数字、符号中至少三类</li>
          <li data-req="weak" class="flex items-center gap-2 tx-sub"><span class="tick">○</span> 不含常见弱词组（admin/password 等）</li>
        </ul>

        <div id="error" class="hidden mt-3 alert alert-error"></div>
        <div id="success" class="hidden mt-3 alert alert-ok"></div>

        <button id="submit" type="submit"
          class="mt-6 w-full btn-primary flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
          <span id="label">确认修改</span>
          <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path></svg>
        </button>
      </form>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const np = $("np"), confirm = $("confirm"), current = $("current");
      const submit = $("submit"), label = $("label"), spinner = $("spinner");
      const errBox = $("error"), okBox = $("success");

      function checks() {
        const v = np.value;
        const c = confirm.value;
        const reqs = {
          len: v.length >= 12,
          cls: [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter((r) => r.test(v)).length >= 3,
          weak: !/admin|password|lumino|123456|qwerty|letmein/i.test(v),
        };
        let passed = 0;
        for (const k in reqs) {
          const li = document.querySelector(`[data-req="${k}"]`);
          const tick = li.querySelector(".tick");
          if (reqs[k]) { li.className = "flex items-center gap-2 tx-ok"; tick.textContent = "●"; passed++; }
          else { li.className = "flex items-center gap-2 tx-sub"; tick.textContent = "○"; }
        }
        return { reqs, passed };
      }

      function strength() {
        const v = np.value;
        if (!v) { setBars(0, "强度：—", "tx-sub"); return; }
        const { reqs, passed } = checks();
        let score = passed;
        const labels = ["极弱", "偏弱", "中等", "强"];
        let lvl = 0;
        if (reqs.len) lvl = Math.min(3, Math.max(1, passed - 1));
        if (v.length >= 16 && passed === 4) lvl = 3;
        setBars(lvl, "强度：" + labels[lvl], "tx-fg");
      }

      function setBars(lvl, text, cls) {
        const palette = [".bar-weak", ".bar-mid", ".bar-mid", ".bar-strong"];
        for (let i = 0; i < 4; i++) {
          const b = $("b" + i);
          b.className = "h-1.5 flex-1 rounded " + (i <= lvl && lvl > 0 ? palette[lvl] : "bar-off");
        }
        const el = $("strength-label");
        el.textContent = text;
        el.className = "mt-1 text-xs " + cls;
      }

      [np, confirm].forEach((el) => el.addEventListener("input", () => { checks(); strength(); errBox.classList.add("hidden"); }));

      $("cp-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.classList.add("hidden");
        okBox.classList.add("hidden");
        const { passed } = checks();
        if (np.value !== confirm.value) { showError("两次输入的密码不一致"); return; }
        if (passed < 3) { showError("请满足全部密码要求"); return; }

        label.textContent = "提交中";
        spinner.classList.remove("hidden");
        submit.disabled = true;
        try {
          const res = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ current_password: current.value, new_password: np.value }),
          });
          const data = await res.json();
          if (res.ok && data.success) {
            okBox.textContent = "密码已更新，正在跳转控制台…";
            okBox.classList.remove("hidden");
            setTimeout(() => (window.location.href = "/dashboard"), 900);
          } else {
            showError(data.error || "修改失败");
            reset();
          }
        } catch (e) {
          showError("网络错误，请稍后重试");
          reset();
        }
      });

      function showError(m) { errBox.textContent = m; errBox.classList.remove("hidden"); }
      function reset() { label.textContent = "确认修改"; spinner.classList.add("hidden"); submit.disabled = false; }
    </script>

    <script>
      (function () {
        var seg = document.getElementById("theme-seg");
        function apply(m) {
          var dark = m === "dark" || (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          seg.querySelectorAll("button").forEach(function (b) { b.classList.toggle("active", b.dataset.theme === m); });
        }
        var m = localStorage.getItem("lumino-theme") || "auto"; apply(m);
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if ((localStorage.getItem("lumino-theme") || "auto") === "auto") apply("auto"); });
        seg.addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; var t = b.dataset.theme; localStorage.setItem("lumino-theme", t); apply(t); });
      })();
    </script>
  </body>
</html>
