<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lumino 安全控制台 · 修改密码</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .grid-bg {
        background-image:
          linear-gradient(rgba(99, 102, 241, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(99, 102, 241, 0.06) 1px, transparent 1px);
        background-size: 38px 38px;
      }
      .glow { box-shadow: 0 0 60px -12px rgba(99, 102, 241, 0.55); }
    </style>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-200 grid-bg flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-gradient-to-br from-amber-950/30 via-slate-950 to-slate-900/60 pointer-events-none"></div>

    <main class="relative w-full max-w-md">
      <div class="flex flex-col items-center mb-6">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 grid place-items-center glow">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            <circle cx="12" cy="16" r="1"></circle>
          </svg>
        </div>
        <h1 class="mt-4 text-2xl font-semibold tracking-tight text-white">安全加固 required</h1>
        <p class="text-sm text-slate-400">检测到使用默认密码，请立即设置新密码</p>
      </div>

      <form id="cp-form" class="relative rounded-2xl border border-white/10 bg-white/5 backdrop-blur-xl p-7 glow">
        <div class="mb-5 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-xs text-amber-300">
          ⚠ 出于安全合规，首次登录必须修改默认密码。新密码强度需满足下方全部要求。
        </div>

        <!-- 当前密码 -->
        <label class="block text-sm font-medium text-slate-300 mb-2">当前密码</label>
        <input id="current" type="password" autocomplete="current-password" required
          class="w-full rounded-xl bg-slate-900/70 border border-white/10 px-4 py-3 text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-indigo-500/60 transition" placeholder="默认 admin" />

        <!-- 新密码 -->
        <label class="block text-sm font-medium text-slate-300 mt-4 mb-2">新密码</label>
        <input id="np" type="password" autocomplete="new-password" required
          class="w-full rounded-xl bg-slate-900/70 border border-white/10 px-4 py-3 text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-indigo-500/60 transition" placeholder="至少 12 位" />

        <!-- 强度条 -->
        <div class="mt-3 flex gap-1">
          <div class="h-1.5 flex-1 rounded bg-slate-700" id="b0"></div>
          <div class="h-1.5 flex-1 rounded bg-slate-700" id="b1"></div>
          <div class="h-1.5 flex-1 rounded bg-slate-700" id="b2"></div>
          <div class="h-1.5 flex-1 rounded bg-slate-700" id="b3"></div>
        </div>
        <p id="strength-label" class="mt-1 text-xs text-slate-500">强度：—</p>

        <!-- 确认 -->
        <label class="block text-sm font-medium text-slate-300 mt-4 mb-2">确认新密码</label>
        <input id="confirm" type="password" autocomplete="new-password" required
          class="w-full rounded-xl bg-slate-900/70 border border-white/10 px-4 py-3 text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-indigo-500/60 transition" />

        <!-- 要求清单 -->
        <ul class="mt-4 space-y-1.5 text-xs">
          <li data-req="len" class="flex items-center gap-2 text-slate-500"><span class="tick">○</span> 至少 12 位字符</li>
          <li data-req="cls" class="flex items-center gap-2 text-slate-500"><span class="tick">○</span> 含大小写字母、数字、符号中至少三类</li>
          <li data-req="weak" class="flex items-center gap-2 text-slate-500"><span class="tick">○</span> 不含常见弱词组（admin/password 等）</li>
          <li data-req="match" class="flex items-center gap-2 text-slate-500"><span class="tick">○</span> 两次输入一致</li>
        </ul>

        <div id="error" class="hidden mt-3 text-sm text-rose-400 bg-rose-500/10 border border-rose-500/20 rounded-lg px-3 py-2"></div>
        <div id="success" class="hidden mt-3 text-sm text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 rounded-lg px-3 py-2"></div>

        <button id="submit" type="submit"
          class="mt-6 w-full rounded-xl bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-400 hover:to-violet-500 text-white font-semibold py-3 transition disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <span id="label">确认修改</span>
          <svg id="spinner" class="hidden w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.4 0 0 5.4 0 12h4z"></path></svg>
        </button>
      </form>
    </main>

    <script>
      const $ = (id) => document.getElementById(id);
      const np = $("np"), confirm = $("confirm"), current = $("current");
      const submit = $("submit"), label = $("label"), spinner = $("spinner");
      const errBox = $("error"), okBox = $("success");

      function checks() {
        const v = np.value;
        const c = confirm.value;
        const reqs = {
          len: v.length >= 12,
          cls: [/[a-z]/, /[A-Z]/, /[0-9]/, /[^a-zA-Z0-9]/].filter((r) => r.test(v)).length >= 3,
          weak: !/admin|password|lumino|123456|qwerty|letmein/i.test(v),
          match: c.length > 0 && v === c && v.length > 0,
        };
        let passed = 0;
        for (const k in reqs) {
          const li = document.querySelector(`[data-req="${k}"]`);
          const tick = li.querySelector(".tick");
          if (reqs[k]) { li.className = "flex items-center gap-2 text-emerald-400"; tick.textContent = "●"; passed++; }
          else { li.className = "flex items-center gap-2 text-slate-500"; tick.textContent = "○"; }
        }
        return { reqs, passed };
      }

      function strength() {
        const v = np.value;
        if (!v) { setBars(0, "强度：—", "text-slate-500"); return; }
        const { reqs, passed } = checks();
        let score = passed;
        const colors = ["bg-rose-500", "bg-orange-500", "bg-amber-400", "bg-emerald-500"];
        const labels = ["极弱", "偏弱", "中等", "强"];
        // 分数映射到 0..3（至少长度达标才计入）
        let lvl = 0;
        if (reqs.len) lvl = Math.min(3, Math.max(1, passed - 1));
        if (v.length >= 16 && passed === 4) lvl = 3;
        setBars(lvl, "强度：" + labels[lvl], "text-slate-300");
      }

      function setBars(lvl, text, cls) {
        for (let i = 0; i < 4; i++) {
          const b = $("b" + i);
          const palette = ["bg-rose-500", "bg-orange-500", "bg-amber-400", "bg-emerald-500"];
          b.className = "h-1.5 flex-1 rounded " + (i <= lvl && lvl > 0 ? palette[lvl] : "bg-slate-700");
        }
        const el = $("strength-label");
        el.textContent = text;
        el.className = "mt-1 text-xs " + cls;
      }

      [np, confirm].forEach((el) => el.addEventListener("input", () => { checks(); strength(); errBox.classList.add("hidden"); }));

      $("cp-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        errBox.classList.add("hidden");
        okBox.classList.add("hidden");
        const { passed } = checks();
        if (passed < 4) { showError("请满足全部密码要求"); return; }

        label.textContent = "提交中";
        spinner.classList.remove("hidden");
        submit.disabled = true;
        try {
          const res = await fetch("/api/auth/change-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ current_password: current.value, new_password: np.value }),
          });
          const data = await res.json();
          if (res.ok && data.success) {
            okBox.textContent = "密码已更新，正在跳转控制台…";
            okBox.classList.remove("hidden");
            setTimeout(() => (window.location.href = "/monitor"), 900);
          } else {
            showError(data.error || "修改失败");
            reset();
          }
        } catch (e) {
          showError("网络错误，请稍后重试");
          reset();
        }
      });

      function showError(m) { errBox.textContent = m; errBox.classList.remove("hidden"); }
      function reset() { label.textContent = "确认修改"; spinner.classList.add("hidden"); submit.disabled = false; }
    </script>
  </body>
</html>
