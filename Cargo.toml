[package]
name = "lumino-server-rs"
version = "1.0.0"
edition = "2021"
description = "Lumino 多人协作服务器 Rust 版 - 超低内存/CPU 占用，超高吞吐"
license = "MIT"

[[bin]]
name = "lumino-server"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
fastrand = "2"
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"
# ── 人机验证（Cloudflare Turnstile 服务端 siteverify）──
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# ── 安全 / 密码存储 ──
argon2 = "0.5"          # Argon2id 内存硬密码哈希（OWASP 推荐）
aes-gcm = "0.10"        # AES-256-GCM 配置文件静态加密（防落盘泄露）
rand = "0.8"            # 真随机盐 / 随机数 / 主密钥
hmac = "0.12"           # 会话令牌 HMAC-SHA256 签名（抗篡改）
sha2 = "0.10"           # HMAC 底层哈希
base64 = "0.22"         # 令牌 / 主密钥编码

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
