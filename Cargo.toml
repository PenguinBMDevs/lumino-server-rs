[package]
name = "lumino-server-rs"
version = "1.0.0"
edition = "2021"
description = "Lumino 多人协作服务器 Rust 版 - 超低内存/CPU 占用，超高吞吐"
license = "MIT"

[[bin]]
name = "lumino-server"
path = "src/main.rs"

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "protocol"
harness = false

[[bench]]
name = "broadcast"
harness = false

[[bench]]
name = "end_to_end"
harness = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "io-util"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
fastrand = "2"
sysinfo = "0.33"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
futures-util = "0.3"
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1
